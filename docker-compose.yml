version: '3.8'

services:
  # PostgreSQL 主库
  postgres-primary:
    image: postgres:16
    container_name: maas-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: maas_platform
      POSTGRES_USER: maas
      POSTGRES_PASSWORD: maas123
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maas -d maas_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: maas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO（备份存储，可选）
  minio:
    image: minio/minio:latest
    container_name: maas-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: maas_admin
      MINIO_ROOT_PASSWORD: maas_minio_123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_primary_data:
  redis_data:
  minio_data: