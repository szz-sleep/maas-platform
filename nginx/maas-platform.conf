# Nginx 反向代理 + HTTPS 配置
# 部署路径（根据服务器系统）：
#   - macOS (Homebrew): /usr/local/etc/nginx/servers/
#   - Ubuntu/Debian: /etc/nginx/sites-available/maas-platform
#   - CentOS/RHEL: /etc/nginx/conf.d/maas-platform.conf

# 安装 nginx:
#   macOS:  brew install nginx
#   Ubuntu: apt install nginx certbot python3-certbot-nginx
#
# 启动:
#   macOS:  brew services start nginx
#   Ubuntu: systemctl start nginx && systemctl enable nginx
#
# HTTPS 证书（Let's Encrypt）:
#   certbot --nginx -d your-domain.com -d api.your-domain.com

# ============================================================
# HTTP → HTTPS 重定向（如果启用 HTTPS）
# ============================================================
server {
    listen 80;
    server_name maas.example.com;  # ← 替换为你的域名

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

